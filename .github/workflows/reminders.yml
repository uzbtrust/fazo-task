name: Eslatmalar

# Telegram: eslatmalar, eskirgan xabarlarni o‘chirish, bosh menyuni yangilash.
# Sir kerak emas: sayt faqat vaqti kelgan ishni bajaradi.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://fazo-task.vercel.app/api/telegram/cron
